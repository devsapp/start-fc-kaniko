Edition: 3.0.0
Type: Project
Name: start-fc-kaniko-v3
Version: dev
Provider:
  - 阿里云
Description: 快速部署 build&push 镜像的应用到阿里云函数计算
HomePage: https://github.com/devsapp/start-fc-kaniko/tree/v3
Organization: 阿里云函数计算（FC）
Effective: Public
Tags:
  - 镜像编译
  - 镜像push
  - Dockerfile
Category: 其它
Service:
  函数计算:
    Authorities:
      - AliyunFCFullAccess
  日志服务: 
    Authorities: 
      - AliyunFCServerlessDevsRolePolicy
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionName
    - roleArn
  properties:
    region:
      title: 地域
      type: string
      default: us-east-1
      description: 创建应用所在的地区
      enum:
        - cn-hangzhou
        - us-east-1
  
    functionName:
      title: 函数名
      type: string
      default: image-builder-${default-suffix}
      pattern: '^[a-zA-Z_][a-zA-Z0-9-_]{0,63}$'
      description: 函数名称，只能包含字母、数字、下划线和中划线。不能以数字、中划线开头。长度在 1-64 之间
  
    roleArn:
      title: RAM角色ARN
      type: string
      default: ''
      pattern: '^acs:ram::[0-9]*:role/.*$'
      description: 应用所属的函数计算服务配置的 role
      required: true
      x-role:
        name: fcacrrole
        service: fc
        authorities:
          - AliyunContainerRegistryFullAccess
          - AliyunFCDefaultRolePolicy