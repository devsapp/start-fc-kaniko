edition: 3.0.0
name: fc-kaniko
access: '{{ access }}'
vars:
  region: '{{ region }}'

resources:
  fc-kaniko:
    component: fc3
    props:
      region: ${vars.region}
      functionName: '{{ functionName }}'
      runtime: custom-container
      cpu: 4
      memorySize: 8192
      diskSize: 10240
      timeout: 7200
      logConfig: auto
      customContainerConfig:
        image: cap-demo-public-registry.cn-hangzhou.cr.aliyuncs.com/cap-app/fc-builder-image:v1.1
      code: ./code
      role: '{{ roleArn }}'
      internetAccess: true
      asyncInvokeConfig:
        maxAsyncEventAgeInSeconds: 18000
        maxAsyncRetryAttempts: 0
        asyncTask: true
      annotations:
        headers:
          x-fc-disable-container-reuse: "True"
